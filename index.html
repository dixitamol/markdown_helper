<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>mdview</title>
<style>
  :root {
    --bg: #ffffff;
    --bg-surface: #f5f5f0;
    --text: #1a1a1a;
    --text-muted: #6b6b6b;
    --accent: #2a5a8a;
    --border: #ddd;
    --code-bg: #f0efe8;
    --blockquote-border: #c0c0b0;
    --shadow: rgba(0,0,0,0.08);
    --font-body: 'Georgia', 'Times New Roman', serif;
    --font-mono: 'Courier New', 'Courier', monospace;
    --font-ui: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111111;
      --bg-surface: #1a1a1a;
      --text: #d8d8d8;
      --text-muted: #888;
      --accent: #6aafe6;
      --border: #333;
      --code-bg: #1e1e1e;
      --blockquote-border: #555;
      --shadow: rgba(0,0,0,0.3);
    }
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html {
    font-size: 17px;
    -webkit-text-size-adjust: 100%;
  }

  body {
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--text);
    line-height: 1.7;
    min-height: 100dvh;
    transition: background 0.2s, color 0.2s;
  }

  /* ---- Landing screen ---- */
  .landing {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100dvh;
    padding: 2rem;
    text-align: center;
  }

  .landing-logo {
    font-family: var(--font-mono);
    font-size: 2.5rem;
    font-weight: bold;
    letter-spacing: -0.05em;
    color: var(--text);
    margin-bottom: 0.25rem;
  }

  .landing-logo span { color: var(--accent); }

  .landing-sub {
    font-family: var(--font-ui);
    font-size: 0.85rem;
    color: var(--text-muted);
    margin-bottom: 2.5rem;
    letter-spacing: 0.02em;
  }

  .landing-actions {
    display: flex;
    gap: 0.75rem;
    flex-wrap: wrap;
    justify-content: center;
  }

  .open-btn, .new-btn {
    font-family: var(--font-ui);
    font-size: 1rem;
    font-weight: 600;
    padding: 0.85rem 2.5rem;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    touch-action: manipulation;
    transition: transform 0.1s, box-shadow 0.15s;
    box-shadow: 0 2px 8px var(--shadow);
  }

  .open-btn {
    background: var(--accent);
    color: #fff;
  }

  .new-btn {
    background: var(--bg-surface);
    color: var(--text);
    border: 1px solid var(--border);
  }

  .open-btn:active, .new-btn:active { transform: scale(0.97); }

  .drop-hint {
    font-family: var(--font-ui);
    font-size: 0.78rem;
    color: var(--text-muted);
    margin-top: 1.5rem;
  }

  /* ---- Reader/Editor screen ---- */
  .reader {
    display: none;
    flex-direction: column;
    min-height: 100dvh;
  }

  .reader.active { display: flex; }

  .toolbar {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.6rem 1rem;
    background: var(--bg-surface);
    border-bottom: 1px solid var(--border);
    font-family: var(--font-ui);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    flex-wrap: wrap;
  }

  .toolbar-back {
    background: none;
    border: none;
    font-size: 1.4rem;
    cursor: pointer;
    color: var(--accent);
    padding: 0.2rem 0.4rem;
    line-height: 1;
    touch-action: manipulation;
  }

  .toolbar-filename {
    flex: 1;
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 60px;
  }

  .toolbar-btn {
    background: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-family: var(--font-ui);
    font-size: 0.75rem;
    color: var(--text-muted);
    padding: 0.3rem 0.6rem;
    cursor: pointer;
    touch-action: manipulation;
  }

  .toolbar-btn.active-mode {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  .toolbar-btn:disabled {
    opacity: 0.4;
    cursor: default;
  }

  /* ---- Formatting toolbar ---- */
  .fmt-bar {
    display: none;
    gap: 0.25rem;
    padding: 0.4rem 1rem;
    background: var(--bg-surface);
    border-bottom: 1px solid var(--border);
    font-family: var(--font-ui);
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    flex-wrap: nowrap;
  }

  .fmt-bar.visible { display: flex; }

  .fmt-btn {
    background: none;
    border: 1px solid var(--border);
    border-radius: 5px;
    font-family: var(--font-mono);
    font-size: 0.78rem;
    color: var(--text);
    padding: 0.35rem 0.55rem;
    cursor: pointer;
    touch-action: manipulation;
    white-space: nowrap;
    flex-shrink: 0;
    line-height: 1;
  }

  .fmt-btn:active { background: var(--accent); color: #fff; }

  /* ---- Markdown content ---- */
  .md-content {
    flex: 1;
    max-width: 680px;
    width: 100%;
    margin: 0 auto;
    padding: 1.5rem 1.25rem 4rem;
    overflow-wrap: break-word;
    word-break: break-word;
  }

  .md-content h1, .md-content h2, .md-content h3,
  .md-content h4, .md-content h5, .md-content h6 {
    font-family: var(--font-ui);
    line-height: 1.3;
    margin: 1.6em 0 0.5em;
    color: var(--text);
  }

  .md-content h1 { font-size: 1.8rem; margin-top: 0.5em; }
  .md-content h2 { font-size: 1.4rem; border-bottom: 1px solid var(--border); padding-bottom: 0.3em; }
  .md-content h3 { font-size: 1.15rem; }
  .md-content h4 { font-size: 1rem; }
  .md-content h5 { font-size: 0.9rem; }
  .md-content h6 { font-size: 0.85rem; color: var(--text-muted); }

  .md-content p { margin: 0.8em 0; }

  .md-content a {
    color: var(--accent);
    text-decoration-thickness: 1px;
    text-underline-offset: 2px;
  }

  .md-content strong { font-weight: 700; }
  .md-content em { font-style: italic; }

  .md-content code {
    font-family: var(--font-mono);
    font-size: 0.88em;
    background: var(--code-bg);
    padding: 0.15em 0.35em;
    border-radius: 4px;
  }

  .md-content pre {
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 1rem;
    overflow-x: auto;
    margin: 1em 0;
    -webkit-overflow-scrolling: touch;
  }

  .md-content pre code {
    background: none;
    padding: 0;
    font-size: 0.82rem;
    line-height: 1.5;
  }

  .md-content blockquote {
    border-left: 3px solid var(--blockquote-border);
    margin: 1em 0;
    padding: 0.4em 0 0.4em 1em;
    color: var(--text-muted);
    font-style: italic;
  }

  .md-content ul, .md-content ol {
    margin: 0.6em 0;
    padding-left: 1.8em;
  }

  .md-content li { margin: 0.25em 0; }
  .md-content li > ul, .md-content li > ol { margin: 0.15em 0; }

  .md-content hr {
    border: none;
    border-top: 1px solid var(--border);
    margin: 2em 0;
  }

  .md-content img {
    max-width: 100%;
    height: auto;
    border-radius: 4px;
    margin: 0.5em 0;
  }

  .md-content .task-item {
    list-style: none;
    margin-left: -1.3em;
  }

  .md-content .task-item input {
    margin-right: 0.4em;
    pointer-events: none;
  }

  .md-content table {
    width: 100%;
    border-collapse: collapse;
    margin: 1em 0;
    font-family: var(--font-ui);
    font-size: 0.88rem;
    display: block;
    overflow-x: auto;
  }

  .md-content th, .md-content td {
    border: 1px solid var(--border);
    padding: 0.5em 0.75em;
    text-align: left;
    white-space: nowrap;
  }

  .md-content th {
    background: var(--bg-surface);
    font-weight: 600;
  }

  /* ---- Editor ---- */
  .editor-area {
    display: none;
    flex: 1;
    max-width: 680px;
    width: 100%;
    margin: 0 auto;
    padding: 0;
    flex-direction: column;
  }

  .editor-area.visible {
    display: flex;
  }

  .editor-textarea {
    flex: 1;
    width: 100%;
    min-height: calc(100dvh - 140px);
    padding: 1.5rem 1.25rem 4rem;
    border: none;
    outline: none;
    resize: none;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 0.88rem;
    line-height: 1.7;
    tab-size: 2;
    -moz-tab-size: 2;
  }

  /* ---- Status bar ---- */
  .status-bar {
    display: none;
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 0.35rem 1rem;
    background: var(--bg-surface);
    border-top: 1px solid var(--border);
    font-family: var(--font-ui);
    font-size: 0.7rem;
    color: var(--text-muted);
    display: flex;
    justify-content: space-between;
    z-index: 10;
  }

  .status-bar.visible { display: flex; }

  /* ---- Raw source view ---- */
  .raw-source {
    display: none;
    flex: 1;
    max-width: 680px;
    width: 100%;
    margin: 0 auto;
    padding: 1.5rem 1.25rem 4rem;
    font-family: var(--font-mono);
    font-size: 0.82rem;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
    color: var(--text-muted);
  }

  /* ---- Scroll to top ---- */
  .scroll-top {
    position: fixed;
    bottom: 1.5rem;
    right: 1.5rem;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--bg-surface);
    color: var(--text-muted);
    font-size: 1.2rem;
    cursor: pointer;
    touch-action: manipulation;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
    box-shadow: 0 2px 8px var(--shadow);
    z-index: 20;
  }

  .scroll-top.visible {
    opacity: 1;
    pointer-events: auto;
  }

  /* ---- Drag & drop overlay ---- */
  .drop-overlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(0,0,0,0.15);
    border: 3px dashed var(--accent);
    justify-content: center;
    align-items: center;
    font-family: var(--font-ui);
    font-size: 1.2rem;
    color: var(--accent);
    font-weight: 600;
  }

  .drop-overlay.active { display: flex; }

  /* ---- Unsaved indicator ---- */
  .unsaved-dot {
    display: none;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    flex-shrink: 0;
  }

  .unsaved-dot.visible { display: inline-block; }

  /* Hide file input */
  #file-input { display: none; }
</style>
</head>
<body>

<!-- Landing -->
<div class="landing" id="landing">
  <div class="landing-logo">md<span>view</span></div>
  <div class="landing-sub">markdown reader & editor</div>
  <div class="landing-actions">
    <button class="open-btn" id="open-btn">Open File</button>
    <button class="new-btn" id="new-btn">New File</button>
  </div>
  <div class="drop-hint">.md files · fully offline · single file</div>
</div>

<!-- Reader/Editor -->
<div class="reader" id="reader">
  <div class="toolbar">
    <button class="toolbar-back" id="back-btn" aria-label="Back">←</button>
    <span class="unsaved-dot" id="unsaved-dot"></span>
    <div class="toolbar-filename" id="filename">file.md</div>
    <button class="toolbar-btn" id="toggle-edit">Edit</button>
    <button class="toolbar-btn" id="toggle-raw">Source</button>
    <button class="toolbar-btn" id="save-btn" style="display:none">Save</button>
    <button class="toolbar-btn" id="open-another">Open</button>
  </div>
  <div class="fmt-bar" id="fmt-bar">
    <button class="fmt-btn" data-fmt="bold" title="Bold (Ctrl+B)"><b>B</b></button>
    <button class="fmt-btn" data-fmt="italic" title="Italic (Ctrl+I)"><i>I</i></button>
    <button class="fmt-btn" data-fmt="code" title="Code">&#96;</button>
    <button class="fmt-btn" data-fmt="h1" title="Heading 1">H1</button>
    <button class="fmt-btn" data-fmt="h2" title="Heading 2">H2</button>
    <button class="fmt-btn" data-fmt="h3" title="Heading 3">H3</button>
    <button class="fmt-btn" data-fmt="link" title="Link">[&#8202;]</button>
    <button class="fmt-btn" data-fmt="ul" title="Bullet list">•</button>
    <button class="fmt-btn" data-fmt="ol" title="Numbered list">1.</button>
    <button class="fmt-btn" data-fmt="task" title="Task">☑</button>
    <button class="fmt-btn" data-fmt="quote" title="Blockquote">></button>
    <button class="fmt-btn" data-fmt="codeblock" title="Code block">```</button>
    <button class="fmt-btn" data-fmt="hr" title="Horizontal rule">—</button>
    <button class="fmt-btn" data-fmt="table" title="Table">⊞</button>
  </div>
  <div class="md-content" id="md-content"></div>
  <pre class="raw-source" id="raw-source"></pre>
  <div class="editor-area" id="editor-area">
    <textarea class="editor-textarea" id="editor-textarea" spellcheck="true" autocomplete="off" autocapitalize="sentences"></textarea>
  </div>
  <div class="status-bar" id="status-bar">
    <span id="word-count"></span>
    <span id="char-count"></span>
  </div>
</div>

<input type="file" id="file-input" accept=".md,.markdown,.txt,text/markdown,text/plain">
<button class="scroll-top" id="scroll-top" aria-label="Scroll to top">↑</button>
<div class="drop-overlay" id="drop-overlay">Drop .md file here</div>

<script>
(function() {
  // --- Elements ---
  const landing      = document.getElementById('landing');
  const reader       = document.getElementById('reader');
  const openBtn      = document.getElementById('open-btn');
  const newBtn       = document.getElementById('new-btn');
  const backBtn      = document.getElementById('back-btn');
  const toggleEdit   = document.getElementById('toggle-edit');
  const toggleRaw    = document.getElementById('toggle-raw');
  const saveBtn      = document.getElementById('save-btn');
  const openMore     = document.getElementById('open-another');
  const fileInput    = document.getElementById('file-input');
  const mdContent    = document.getElementById('md-content');
  const rawSource    = document.getElementById('raw-source');
  const editorArea   = document.getElementById('editor-area');
  const editorTA     = document.getElementById('editor-textarea');
  const fmtBar       = document.getElementById('fmt-bar');
  const filenameEl   = document.getElementById('filename');
  const scrollTopEl  = document.getElementById('scroll-top');
  const dropOverlay  = document.getElementById('drop-overlay');
  const statusBar    = document.getElementById('status-bar');
  const wordCountEl  = document.getElementById('word-count');
  const charCountEl  = document.getElementById('char-count');
  const unsavedDot   = document.getElementById('unsaved-dot');

  // --- State ---
  let mode = 'view'; // 'view' | 'edit' | 'source'
  let currentRaw = '';
  let currentName = 'untitled.md';
  let fileHandle = null; // for save-in-place
  let hasUnsaved = false;

  // --- File handler ---
  function handleFile(file) {
    if (!file) return;
    const r = new FileReader();
    r.onload = () => {
      currentRaw = r.result;
      currentName = file.name;
      fileHandle = null;
      hasUnsaved = false;
      enterView();
    };
    r.readAsText(file);
  }

  // --- Mode switching ---
  function enterView() {
    mode = 'view';
    filenameEl.textContent = currentName;
    document.title = currentName + ' — mdview';
    mdContent.innerHTML = parseMd(currentRaw);
    mdContent.style.display = '';
    rawSource.style.display = 'none';
    editorArea.classList.remove('visible');
    fmtBar.classList.remove('visible');
    statusBar.classList.remove('visible');
    toggleEdit.textContent = 'Edit';
    toggleEdit.classList.remove('active-mode');
    toggleRaw.textContent = 'Source';
    saveBtn.style.display = 'none';
    unsavedDot.classList.toggle('visible', hasUnsaved);
    landing.style.display = 'none';
    reader.classList.add('active');
    window.scrollTo(0, 0);
  }

  function enterEdit() {
    mode = 'edit';
    editorTA.value = currentRaw;
    mdContent.style.display = 'none';
    rawSource.style.display = 'none';
    editorArea.classList.add('visible');
    fmtBar.classList.add('visible');
    statusBar.classList.add('visible');
    toggleEdit.textContent = 'Preview';
    toggleEdit.classList.add('active-mode');
    toggleRaw.textContent = 'Source';
    saveBtn.style.display = '';
    updateCounts();
    editorTA.focus();
  }

  function enterSource() {
    mode = 'source';
    rawSource.textContent = currentRaw;
    mdContent.style.display = 'none';
    editorArea.classList.remove('visible');
    fmtBar.classList.remove('visible');
    statusBar.classList.remove('visible');
    rawSource.style.display = 'block';
    toggleRaw.textContent = 'Rendered';
    toggleEdit.textContent = 'Edit';
    toggleEdit.classList.remove('active-mode');
    saveBtn.style.display = 'none';
  }

  function showLanding() {
    if (hasUnsaved && !confirm('You have unsaved changes. Leave anyway?')) return;
    reader.classList.remove('active');
    landing.style.display = '';
    document.title = 'mdview';
    hasUnsaved = false;
    fileHandle = null;
  }

  // --- Event listeners ---
  openBtn.addEventListener('click', () => fileInput.click());
  openMore.addEventListener('click', () => fileInput.click());
  backBtn.addEventListener('click', showLanding);

  newBtn.addEventListener('click', () => {
    currentRaw = '# New Document\n\n';
    currentName = 'untitled.md';
    fileHandle = null;
    hasUnsaved = false;
    enterEdit();
    landing.style.display = 'none';
    reader.classList.add('active');
    filenameEl.textContent = currentName;
    document.title = currentName + ' — mdview';
  });

  toggleEdit.addEventListener('click', () => {
    if (mode === 'edit') {
      // going back to preview — capture edits
      currentRaw = editorTA.value;
      enterView();
    } else {
      enterEdit();
    }
  });

  toggleRaw.addEventListener('click', () => {
    if (mode === 'source') {
      enterView();
    } else if (mode === 'view') {
      enterSource();
    } else {
      // from edit, go to source (save edits first)
      currentRaw = editorTA.value;
      enterSource();
    }
  });

  fileInput.addEventListener('change', (e) => {
    handleFile(e.target.files[0]);
    fileInput.value = '';
  });

  // --- Editor: track changes ---
  editorTA.addEventListener('input', () => {
    hasUnsaved = true;
    unsavedDot.classList.add('visible');
    updateCounts();
  });

  // --- Word/char count ---
  function updateCounts() {
    const text = editorTA.value;
    const chars = text.length;
    const words = text.trim() === '' ? 0 : text.trim().split(/\s+/).length;
    wordCountEl.textContent = words + ' word' + (words !== 1 ? 's' : '');
    charCountEl.textContent = chars + ' char' + (chars !== 1 ? 's' : '');
  }

  // --- Tab key in editor ---
  editorTA.addEventListener('keydown', (e) => {
    if (e.key === 'Tab') {
      e.preventDefault();
      insertAtCursor('  ');
    }
  });

  // --- Save ---
  saveBtn.addEventListener('click', saveFile);

  async function saveFile() {
    currentRaw = editorTA.value;
    // Try native file picker (Chrome)
    if ('showSaveFilePicker' in window) {
      try {
        if (!fileHandle) {
          fileHandle = await window.showSaveFilePicker({
            suggestedName: currentName,
            types: [{ description: 'Markdown', accept: { 'text/markdown': ['.md'] } }]
          });
        }
        const writable = await fileHandle.createWritable();
        await writable.write(currentRaw);
        await writable.close();
        currentName = fileHandle.name;
        filenameEl.textContent = currentName;
        document.title = currentName + ' — mdview';
        hasUnsaved = false;
        unsavedDot.classList.remove('visible');
        return;
      } catch (err) {
        if (err.name === 'AbortError') return;
        // fall through to download
      }
    }
    // Fallback: download
    const blob = new Blob([currentRaw], { type: 'text/markdown' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = currentName;
    a.click();
    URL.revokeObjectURL(a.href);
    hasUnsaved = false;
    unsavedDot.classList.remove('visible');
  }

  // --- Keyboard shortcuts ---
  document.addEventListener('keydown', (e) => {
    if (mode !== 'edit') return;
    const mod = e.ctrlKey || e.metaKey;
    if (mod && e.key === 'b') { e.preventDefault(); applyFormat('bold'); }
    else if (mod && e.key === 'i') { e.preventDefault(); applyFormat('italic'); }
    else if (mod && e.key === 's') { e.preventDefault(); saveFile(); }
  });

  // --- Formatting toolbar ---
  fmtBar.addEventListener('click', (e) => {
    const btn = e.target.closest('.fmt-btn');
    if (!btn) return;
    applyFormat(btn.dataset.fmt);
    editorTA.focus();
  });

  function applyFormat(fmt) {
    const ta = editorTA;
    const start = ta.selectionStart;
    const end = ta.selectionEnd;
    const sel = ta.value.substring(start, end);
    const before = ta.value.substring(0, start);
    const after = ta.value.substring(end);

    let insert = '';
    let cursorOffset = 0;

    switch (fmt) {
      case 'bold':
        insert = '**' + (sel || 'bold text') + '**';
        cursorOffset = sel ? insert.length : 2;
        break;
      case 'italic':
        insert = '*' + (sel || 'italic text') + '*';
        cursorOffset = sel ? insert.length : 1;
        break;
      case 'code':
        insert = '`' + (sel || 'code') + '`';
        cursorOffset = sel ? insert.length : 1;
        break;
      case 'h1':
        insert = linePrefix(before, '# ', sel); break;
      case 'h2':
        insert = linePrefix(before, '## ', sel); break;
      case 'h3':
        insert = linePrefix(before, '### ', sel); break;
      case 'link':
        insert = '[' + (sel || 'text') + '](url)';
        cursorOffset = sel ? insert.length - 4 : 1;
        break;
      case 'ul':
        insert = linePrefix(before, '- ', sel); break;
      case 'ol':
        insert = linePrefix(before, '1. ', sel); break;
      case 'task':
        insert = linePrefix(before, '- [ ] ', sel); break;
      case 'quote':
        insert = linePrefix(before, '> ', sel); break;
      case 'codeblock':
        insert = '\n```\n' + (sel || '') + '\n```\n';
        cursorOffset = sel ? insert.length : 5;
        break;
      case 'hr':
        insert = '\n---\n';
        cursorOffset = insert.length;
        break;
      case 'table':
        insert = '\n| Header | Header |\n|--------|--------|\n| Cell   | Cell   |\n';
        cursorOffset = insert.length;
        break;
      default:
        return;
    }

    ta.value = before + insert + after;
    const newPos = start + (cursorOffset || insert.length);
    ta.selectionStart = ta.selectionEnd = newPos;
    ta.dispatchEvent(new Event('input'));
  }

  function linePrefix(before, prefix, sel) {
    // If we're mid-line, add a newline first
    const needsNL = before.length > 0 && before[before.length - 1] !== '\n';
    return (needsNL ? '\n' : '') + prefix + (sel || '');
  }

  function insertAtCursor(text) {
    const ta = editorTA;
    const start = ta.selectionStart;
    ta.value = ta.value.substring(0, start) + text + ta.value.substring(ta.selectionEnd);
    ta.selectionStart = ta.selectionEnd = start + text.length;
    ta.dispatchEvent(new Event('input'));
  }

  // --- Scroll to top ---
  window.addEventListener('scroll', () => {
    scrollTopEl.classList.toggle('visible', window.scrollY > 400);
  }, { passive: true });

  scrollTopEl.addEventListener('click', () => {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  // --- Drag & drop ---
  let dragCounter = 0;

  document.addEventListener('dragenter', (e) => {
    e.preventDefault();
    dragCounter++;
    dropOverlay.classList.add('active');
  });

  document.addEventListener('dragleave', (e) => {
    e.preventDefault();
    dragCounter--;
    if (dragCounter <= 0) {
      dragCounter = 0;
      dropOverlay.classList.remove('active');
    }
  });

  document.addEventListener('dragover', (e) => e.preventDefault());

  document.addEventListener('drop', (e) => {
    e.preventDefault();
    dragCounter = 0;
    dropOverlay.classList.remove('active');
    const file = e.dataTransfer.files[0];
    if (file) handleFile(file);
  });

  // --- Warn before leaving with unsaved changes ---
  window.addEventListener('beforeunload', (e) => {
    if (hasUnsaved) {
      e.preventDefault();
      e.returnValue = '';
    }
  });

  // --- Markdown Parser ---
  function parseMd(src) {
    const lines = src.split('\n');
    let html = '';
    let i = 0;
    const len = lines.length;

    while (i < len) {
      const line = lines[i];

      if (line.trim() === '') { i++; continue; }

      if (/^```/.test(line)) {
        const lang = line.slice(3).trim();
        const codeLines = [];
        i++;
        while (i < len && !/^```/.test(lines[i])) {
          codeLines.push(escHtml(lines[i]));
          i++;
        }
        i++;
        html += '<pre><code' + (lang ? ' class="lang-' + escHtml(lang) + '"' : '') + '>' + codeLines.join('\n') + '</code></pre>\n';
        continue;
      }

      const hMatch = line.match(/^(#{1,6})\s+(.*)$/);
      if (hMatch) {
        const level = hMatch[1].length;
        html += '<h' + level + '>' + inlineFormat(hMatch[2]) + '</h' + level + '>\n';
        i++; continue;
      }

      if (/^(\*{3,}|-{3,}|_{3,})\s*$/.test(line.trim())) {
        html += '<hr>\n';
        i++; continue;
      }

      if (line.includes('|') && i + 1 < len && /^\|?\s*[-:]+[-| :]*$/.test(lines[i + 1])) {
        html += parseTable(lines, i);
        while (i < len && lines[i].includes('|') && lines[i].trim() !== '') i++;
        continue;
      }

      if (/^>\s?/.test(line)) {
        const bqLines = [];
        while (i < len && /^>\s?/.test(lines[i])) {
          bqLines.push(lines[i].replace(/^>\s?/, ''));
          i++;
        }
        html += '<blockquote>' + parseMd(bqLines.join('\n')) + '</blockquote>\n';
        continue;
      }

      if (/^[\s]*[-*+]\s/.test(line)) {
        html += parseList(lines, i, 'ul');
        while (i < len && (/^[\s]*[-*+]\s/.test(lines[i]) || (/^\s+/.test(lines[i]) && lines[i].trim() !== ''))) i++;
        continue;
      }

      if (/^[\s]*\d+\.\s/.test(line)) {
        html += parseList(lines, i, 'ol');
        while (i < len && (/^[\s]*\d+\.\s/.test(lines[i]) || (/^\s+/.test(lines[i]) && lines[i].trim() !== ''))) i++;
        continue;
      }

      const pLines = [];
      while (i < len && lines[i].trim() !== '' &&
             !/^#{1,6}\s/.test(lines[i]) &&
             !/^```/.test(lines[i]) &&
             !/^>\s?/.test(lines[i]) &&
             !/^[-*+]\s/.test(lines[i].trim()) &&
             !/^\d+\.\s/.test(lines[i].trim()) &&
             !/^(\*{3,}|-{3,}|_{3,})\s*$/.test(lines[i].trim()) &&
             !(lines[i].includes('|') && i + 1 < len && /^\|?\s*[-:]+[-| :]*$/.test(lines[i + 1]))) {
        pLines.push(lines[i]);
        i++;
      }
      if (pLines.length) {
        html += '<p>' + inlineFormat(pLines.join('\n')) + '</p>\n';
      }
    }

    return html;
  }

  function parseTable(lines, start) {
    let i = start;
    const headerRow = parseTableRow(lines[i]); i++;
    const alignRow  = lines[i]; i++;

    const aligns = alignRow.split('|').filter(c => c.trim() !== '').map(c => {
      c = c.trim();
      if (c.startsWith(':') && c.endsWith(':')) return 'center';
      if (c.endsWith(':')) return 'right';
      return 'left';
    });

    let out = '<table><thead><tr>';
    headerRow.forEach((cell, idx) => {
      const a = aligns[idx] || 'left';
      out += '<th style="text-align:' + a + '">' + inlineFormat(cell) + '</th>';
    });
    out += '</tr></thead><tbody>';

    while (i < lines.length && lines[i].includes('|') && lines[i].trim() !== '') {
      const cells = parseTableRow(lines[i]);
      out += '<tr>';
      cells.forEach((cell, idx) => {
        const a = aligns[idx] || 'left';
        out += '<td style="text-align:' + a + '">' + inlineFormat(cell) + '</td>';
      });
      out += '</tr>';
      i++;
    }

    out += '</tbody></table>\n';
    return out;
  }

  function parseTableRow(line) {
    return line.replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => c.trim());
  }

  function parseList(lines, start, tag) {
    const items = [];
    let i = start;
    const listPat = tag === 'ul' ? /^[\s]*[-*+]\s(.*)$/ : /^[\s]*\d+\.\s(.*)$/;

    while (i < lines.length) {
      const m = lines[i].match(listPat);
      if (m) {
        let content = m[1];
        const taskMatch = content.match(/^\[([ xX])\]\s(.*)/);
        if (taskMatch) {
          const checked = taskMatch[1] !== ' ' ? ' checked' : '';
          items.push({ task: true, checked, text: taskMatch[2] });
        } else {
          items.push({ task: false, text: content });
        }
        i++;
      } else if (/^\s+/.test(lines[i]) && lines[i].trim() !== '') {
        if (items.length) items[items.length - 1].text += ' ' + lines[i].trim();
        i++;
      } else {
        break;
      }
    }

    let out = '<' + tag + '>\n';
    for (const item of items) {
      if (item.task) {
        out += '<li class="task-item"><input type="checkbox"' + item.checked + ' disabled> ' + inlineFormat(item.text) + '</li>\n';
      } else {
        out += '<li>' + inlineFormat(item.text) + '</li>\n';
      }
    }
    out += '</' + tag + '>\n';
    return out;
  }

  function inlineFormat(text) {
    let s = escHtml(text);
    s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img src="$2" alt="$1">');
    s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    s = s.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
    s = s.replace(/___(.+?)___/g, '<strong><em>$1</em></strong>');
    s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/__(.+?)__/g, '<strong>$1</strong>');
    s = s.replace(/\*(.+?)\*/g, '<em>$1</em>');
    s = s.replace(/_(.+?)_/g, '<em>$1</em>');
    s = s.replace(/~~(.+?)~~/g, '<del>$1</del>');
    s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
    s = s.replace(/\n/g, '<br>');
    return s;
  }

  function escHtml(str) {
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
})();
</script>

</body>
</html>
